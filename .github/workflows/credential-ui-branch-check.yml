name: Verify CPAMP integration preview

on:
  push:
    branches:
      - codex/sync-cpamp-upstream-20261023
      - 'codex/verify-credential-ui-**'

permissions:
  contents: read

jobs:
  verify-delete-confirmation:
    if: github.repository == '0xTract0r/CPA-Manager-Plus'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Confirm checked-out HEAD equals github.sha
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$GITHUB_SHA" ]; then
            echo "HEAD $actual != GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Type-check web workspace
        run: npm --workspace apps/web run type-check

      - name: Verify demo request logging and configuration edits
        run: npm --workspace apps/web test -- src/features/demo/demoApi.config.test.ts

      - name: Verify historical provider and account filters
        run: npm --workspace apps/web test -- src/features/monitoring/model/analyticsAdapters.test.ts

      - name: Verify model rule drafts during refresh and connection changes
        run: npm --workspace apps/web test -- src/features/authFiles/components/OAuthEditorModals.test.tsx

      - name: Verify case-distinct Gemini model IDs in both editors
        run: |
          npm --workspace apps/web test -- src/features/aiProviders/modelDiscoveryRefresh.test.tsx -t 'keeps case-distinct Gemini IDs selectable and merges each exact ID once'
          npm --workspace apps/web test -- src/services/api/models.test.ts -t 'shares Gemini pagination but keeps default and exact results separate'

      - name: Run allowlisted delete-confirmation tests and validate report
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --input-type=commonjs - <<'EOF'
          'use strict';
          const { spawnSync } = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');

          // 唯一白名单：既用于构造 -t 正则，也用于校验 JSON 结果
          const ALLOWLIST = [
            {
              file: 'src/features/accounts/AccountsPage.test.tsx',
              suite: 'AccountsPage replacement flows',
              titles: [
                'passes a file-scoped preview and leaves the first confirmation label to the shared hook',
                'counts files beyond the filter, not beyond the current page (3)',
                'counts files beyond the filter, not beyond the current page (35)',
              ],
            },
            {
              file: 'src/features/authFiles/AuthFilesPage.pasteIntegration.test.tsx',
              suite: 'AuthFilesPage real auth JSON paste flow',
              titles: [
                'scopes delete all to the selected Codex plan filter',
                'discloses hidden files in the toolbar confirmation (plan filter=true)',
                'discloses hidden files in the toolbar confirmation (plan filter=false)',
                'counts one physical file when two visible rows share its name',
              ],
            },
          ];

          const fail = (msg) => {
            console.error(`FAIL: ${msg}`);
            process.exit(1);
          };

          const escapeRegex = (s) => s.replace(/[.*+?^$|()[\]{}\\\/]/g, '\\$&');

          const expected = new Map();
          const fullNames = [];
          for (const entry of ALLOWLIST) {
            if (!fs.existsSync(entry.file)) fail(`missing test file ${entry.file}`);
            for (const title of entry.titles) {
              const key = JSON.stringify([entry.file, entry.suite, title]);
              if (expected.has(key)) fail(`duplicate allowlist entry ${key}`);
              expected.set(key, 0);
              fullNames.push(`${entry.suite} ${title}`);
            }
          }

          // 允许 vitest 在全名前带文件/父级前缀，但尾部必须精确匹配
          const pattern = `(?:^| )(?:${fullNames.map(escapeRegex).join('|')})$`;
          const files = ALLOWLIST.map((e) => e.file);
          const outputFile = path.join(process.env.RUNNER_TEMP || '/tmp', 'vitest-delete-confirmation.json');
          try { fs.rmSync(outputFile, { force: true }); } catch {}

          const run = spawnSync(
            'npx',
            ['--no-install', 'vitest', 'run', ...files, '-t', pattern, '--reporter=json', `--outputFile=${outputFile}`],
            { stdio: 'inherit', env: process.env },
          );
          if (run.error) fail(`vitest spawn error: ${run.error.message}`);
          if (run.status !== 0) fail(`vitest exited with status ${run.status}`);
          if (!fs.existsSync(outputFile)) fail('vitest JSON report missing');

          const report = JSON.parse(fs.readFileSync(outputFile, 'utf8'));
          if (!Array.isArray(report.testResults)) fail('report.testResults missing');

          const allowedFiles = new Set(files);
          const seenFiles = new Set();
          for (const result of report.testResults) {
            const rel = path.relative(process.cwd(), result.name).split(path.sep).join('/');
            if (!allowedFiles.has(rel)) fail(`unexpected test file in report: ${rel}`);
            if (seenFiles.has(rel)) fail(`duplicate file result: ${rel}`);
            seenFiles.add(rel);
            for (const a of result.assertionResults || []) {
              const ancestors = Array.isArray(a.ancestorTitles) ? a.ancestorTitles : [];
              const suite = ancestors.join(' ');
              const key = JSON.stringify([rel, suite, a.title]);
              if (expected.has(key)) {
                expected.set(key, expected.get(key) + 1);
                if (a.status !== 'passed') fail(`expected test not passed (${a.status}): ${key}`);
              } else if (a.status !== 'skipped') {
                fail(`non-allowlisted test was not skipped (${a.status}): ${key}`);
              }
            }
          }
          for (const f of allowedFiles) {
            if (!seenFiles.has(f)) fail(`test file missing from report: ${f}`);
          }
          for (const [key, count] of expected) {
            if (count !== 1) fail(`expected exactly one result, got ${count}: ${key}`);
          }
          if (report.success !== true) fail('report.success is not true');
          if ((report.numFailedTests ?? 0) !== 0) fail(`numFailedTests=${report.numFailedTests}`);

          console.log(`OK: ${expected.size} allowlisted tests passed exactly once; all other rows skipped.`);
          EOF

  verify-monitoring-rollups:
    name: Verify monitoring counts and archived upgrades
    if: github.repository == '0xTract0r/CPA-Manager-Plus'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/manager-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/manager-server/go.mod
          cache-dependency-path: apps/manager-server/go.sum
      - name: Test success and failure counts and rebuilds
        run: go test -mod=readonly -race -count=1 -run '^TestAnalyticsStatusRollup' ./internal/service/monitoring
      - name: Test archived source preservation
        run: go test -mod=readonly -race -count=1 -run '^TestMonitoringStatusRebuildPreservesArchivedRows$' ./internal/service/usage
